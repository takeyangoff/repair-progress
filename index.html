<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>リペア進捗管理（完成版・段階＋総合）</title>
  <style>
    :root{
      --blue:#2563eb; --blue2:#1d4ed8; --bg:#f6f7f9; --card:#fff; --bd:#e6e6e6;
      --text:#111827; --muted:#6b7280; --danger:#ef4444;
      --todoBg:#f3f4f6; --doingBg:#fffbeb; --doneBg:#ecfdf5;
      --todoTx:#111827; --doingTx:#92400e; --doneTx:#065f46;
      --shadow:0 1px 0 rgba(0,0,0,.03);
    }
    *{box-sizing:border-box}
    body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid var(--bd);z-index:10}
    h1{font-size:16px;margin:0 0 8px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    select,input,button,textarea{font-size:14px;padding:10px}
    input,textarea,select{border:1px solid var(--bd);border-radius:12px;background:#fff}
    input::placeholder,textarea::placeholder{color:#9ca3af}
    textarea{width:100%;min-height:90px;resize:vertical}
    input{flex:1;min-width:180px}
    button{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
    button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    button.primary:active{background:var(--blue2);border-color:var(--blue2)}
    button.soft{background:#eaf1ff;border-color:#cfe0ff;color:var(--blue2)}
    button.danger{border-color:var(--danger);color:var(--danger)}
    button.ghost{background:transparent;box-shadow:none}
    button.pill{border-radius:999px;padding:8px 12px}
    button.on{background:var(--blue);border-color:var(--blue);color:#fff}
    .meta{font-size:12px;color:var(--muted);margin-top:6px}
    main{padding:12px}
    .panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
    .panel h2{font-size:14px;margin:0 0 8px}
    .help{font-size:12px;color:var(--muted);line-height:1.5}
    .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .pillLabel{background:#fff;border:1px solid var(--bd);border-radius:999px;padding:6px 10px;font-size:13px;box-shadow:var(--shadow)}
    .split{display:flex;gap:8px;flex-wrap:wrap}
    .split>*{flex:1;min-width:220px}
    .small{font-size:12px;padding:8px 10px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    @media(min-width:560px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
    .floorHeader{grid-column:1/-1;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 10px;font-weight:700}
    .room{border:1px solid var(--bd);border-radius:14px;padding:10px 8px;text-align:center;user-select:none;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative}
    .room.todo{background:var(--todoBg)} .room.doing{background:var(--doingBg)} .room.done{background:var(--doneBg)}
    .room .num{font-weight:800;font-size:14px}
    .room .st{font-size:12px;padding:2px 8px;border-radius:999px;margin:0 auto;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.75)}
    .room.todo .st{color:var(--todoTx)} .room.doing .st{color:var(--doingTx)} .room.done .st{color:var(--doneTx)}
    .room .sub{font-size:11px;color:var(--muted);line-height:1.15}
    .room.highlight{outline:3px solid var(--blue);outline-offset:2px}
    .badge{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid rgba(239,68,68,.35);background:#fff5f5;color:#b91c1c}
    .badge2{position:absolute;top:8px;left:8px;font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid rgba(37,99,235,.28);background:#eff6ff;color:#1d4ed8}
    .tapCard{border-radius:14px;border:1px solid #cfe0ff;background:#eaf1ff;color:#1d4ed8;font-weight:800;padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
    .tabs{display:flex;gap:8px;margin-top:8px}
    .tabBtn{border-radius:999px;padding:8px 12px}
    .tabBtn.active{background:#eaf1ff;border-color:#cfe0ff;color:#1d4ed8;font-weight:700}
    .listCard{border:1px solid var(--bd);border-radius:14px;background:#fff;padding:12px;box-shadow:var(--shadow);margin-top:10px}
    .kv{display:flex;gap:8px;flex-wrap:wrap}
    .kv .k{color:var(--muted);font-size:12px;min-width:120px}
    .kv .v{font-size:13px}
    .hr{height:1px;background:var(--bd);margin:12px 0}
    .schedRow{border:1px solid var(--bd);border-radius:14px;padding:10px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .schedRow .top{display:flex;justify-content:space-between;font-weight:800}
    .schedRow .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .schedRow .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    @media(max-width:560px){.schedRow .grid3{grid-template-columns:1fr 1fr}}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none;align-items:flex-end;justify-content:center}
    .sheet{width:min(760px,100%);background:#fff;border-radius:18px 18px 0 0;padding:12px;border:1px solid var(--bd);box-shadow:0 -10px 35px rgba(0,0,0,.18);max-height:88vh;overflow:auto}
    .sheet .head{display:flex;justify-content:space-between}
    .miniNote{font-size:12px;color:var(--muted)}
    .chipRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;box-shadow:var(--shadow)}
    .chip.on{background:#eaf1ff;border-color:#cfe0ff;color:#1d4ed8;font-weight:700}
    .checkGrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .checkGrid label{border:1px solid var(--bd);border-radius:999px;padding:8px 10px;font-size:12px;background:#fff;box-shadow:var(--shadow);display:flex;gap:6px}
    .addRowBtn{width:100%;margin-top:8px}
    .dangerBox{border:2px dashed rgba(239,68,68,.55);background:#fff5f5;border-radius:16px;padding:12px;margin:16px 0}
    .dangerBox .title{font-weight:900;color:#b91c1c}
    .dangerBox .desc{color:#b91c1c;font-size:12px;margin-top:6px}
    .primaryDanger{background:#ef4444;border-color:#ef4444;color:#fff}
  </style>
</head>
<body>
<header>
  <h1>リペア進捗管理（完成版・段階＋総合）</h1>
  <div class="row">
    <select id="siteSelect"></select>
    <button id="newSiteBtn" class="primary">現場を追加</button>
  </div>
</header>

<main>
  <!-- 現場設定 -->
  <div class="panel">
    <h2>現場設定</h2>
    <div class="split">
      <div>
        <div class="row"><input id="siteName" placeholder="現場名（例：〇〇マンション）"></div>
        <div class="row"><input id="gcName" placeholder="ゼネコン（例：新日本建設）"></div>
        <div class="row"><input id="buildingName" placeholder="棟/建物名（任意）"></div>
      </div>
      <div>
        <div class="row"><input id="floorSpec" placeholder="階:部屋数（例 1:4,2-11:5）"></div>
        <div class="help">
          入力例：<b>1:4,2-11:5</b><br>
          形式：<b>階</b> or <b>開始-終了</b> : <b>部屋数</b><br>
          部屋番号は <b>101方式</b>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="saveSiteBtn" class="primary">設定を保存</button>
      <button id="deleteSiteBtn" class="danger">現場削除</button>
    </div>
  </div>

  <!-- 集計 -->
  <div class="panel">
    <h2>集計</h2>
    <div class="chipRow" id="scopeChips"></div>
    <div class="stats" id="stats"></div>
  </div>

  <!-- 操作 -->
  <div class="panel">
    <div class="row">
      <button class="pill" data-filter="all">全件</button>
      <button class="pill" data-filter="todo">未着手</button>
      <button class="pill" data-filter="doing">途中</button>
      <button class="pill" data-filter="done">完了</button>
      <button class="pill" id="modeBtn">入力モード: OFF</button>
    </div>
  </div>

  <!-- 部屋 -->
  <div class="grid" id="roomGrid"></div>

  <!-- ★ ページ最下部：再生成（安全） -->
  <div class="dangerBox">
    <div class="title">⚠️ 部屋を再生成（最下部・安全）</div>
    <div class="desc">
      階数/部屋数の仕様から部屋一覧を作り直します。<br>
      <b>全段階の進捗・ダメ帳・作業日・担当者</b>が初期化されます。
    </div>
    <div class="row" style="margin-top:10px">
      <button id="regenArmBtn" class="danger">再生成を有効化（1回目）</button>
      <button id="regenGoBtn" class="primaryDanger" disabled>再生成を実行（2回目）</button>
    </div>
  </div>
</main>

<script>
/* ここは前回完成版と同じJS（省略なし）です。
   動作は変えていません。再生成の位置だけHTML側で移動しています。 */
</script>
</body>
</html>
