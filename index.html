<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>リペア進捗管理</title>

<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#f6f7f9}
header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #e6e6e6;z-index:10}
h1{font-size:16px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,button,textarea{font-size:14px;padding:8px}
input{flex:1;min-width:160px}
textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:12px}
button{border:1px solid #ddd;background:#fff;border-radius:10px}
button.primary{background:#111827;color:#fff;border-color:#111827}
button.danger{border-color:#ef4444;color:#ef4444}
button.small{font-size:12px;padding:6px 10px;border-radius:999px}
input.small{font-size:12px;padding:6px 10px;border-radius:999px}

.meta{font-size:12px;color:#6b7280;margin-top:6px}
main{padding:12px}
.panel{background:#fff;border:1px solid #e6e6e6;border-radius:12px;padding:12px;margin-bottom:12px}
.panel h2{font-size:14px;margin:0 0 8px}
.help{font-size:12px;color:#6b7280;line-height:1.5}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{background:#fff;border:1px solid #e6e6e6;border-radius:999px;padding:6px 10px;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}

.room{background:#fff;border:1px solid #e6e6e6;border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer}
.room.todo{background:#f9fafb}
.room.doing{background:#fffbeb;border-color:#f59e0b}
.room.done{background:#ecfdf5;border-color:#10b981}
.room .num{font-weight:700}
.room .sub{font-size:11px;color:#6b7280}

.floorHeader{grid-column:1/-1;font-weight:700;padding:6px}

details summary{cursor:pointer;font-weight:700}
details{margin-top:8px}

.hidden{display:none}

/* 管理画面 */
.dangerPanel{
  border:2px solid #ef4444;
  background:#fff5f5;
  margin-top:16px
}
.dangerPanel .help{color:#b91c1c}
button.armed{
  background:#ef4444;
  color:#fff;
  border-color:#ef4444
}
</style>
</head>

<body>
<header>
<h1>リペア進捗管理</h1>
<div class="row">
  <select id="siteSelect"></select>
  <button id="newSiteBtn" class="primary">現場追加</button>
  <button id="manageBtn">⚙ 管理</button>
</div>
<div class="meta" id="siteMeta"></div>
</header>

<main>

<!-- ===== 通常画面 ===== -->
<div id="mainView">

<div class="panel">
<h2>現場設定</h2>
<div class="row">
  <input id="siteName" placeholder="現場名"/>
  <input id="buildingName" placeholder="棟名"/>
</div>
<div class="row">
  <input id="floorSpec" placeholder="階:部屋数（例 1:4,2-11:5）"/>
</div>
<button id="saveSiteBtn" class="primary">設定を保存</button>
</div>

<div class="stats" id="stats"></div>

<div class="panel">
<div class="row">
  <button class="small" data-filter="all">全件</button>
  <button class="small" data-filter="todo">未着手</button>
  <button class="small" data-filter="doing">途中</button>
  <button class="small" data-filter="done">完了</button>
</div>
<div class="row" style="margin-top:6px">
  <input id="jumpInput" class="small" placeholder="部屋番号"/>
  <button id="jumpBtn" class="small">移動</button>
</div>
</div>

<div class="grid" id="roomGrid"></div>
</div>

<!-- ===== 管理画面 ===== -->
<div id="adminView" class="hidden">

<div class="panel">
<div class="row" style="justify-content:space-between">
<h2>管理（危険操作）</h2>
<button id="backBtn">← 戻る</button>
</div>
<div class="help">誤操作防止のため、危険な操作はここにまとめています。</div>
</div>

<div class="panel">
<h2>進捗の初期化</h2>
<button id="resetAllBtn" class="danger">全て未着手に戻す</button>
</div>

<div class="panel">
<h2>現場削除</h2>
<button id="deleteSiteBtn" class="danger">現場削除</button>
</div>

<!-- 最下部・最重要 -->
<div class="panel dangerPanel">
<h2>⚠ 部屋を再生成（最終操作）</h2>
<div class="help">
・進捗／作業日／担当者がすべて消えます<br/>
・この操作は元に戻せません
</div>
<button id="regenRoomsBtn" class="danger" style="margin-top:8px">
部屋を再生成
</button>
</div>

</div>
</main>

<script>
const $=id=>document.getElementById(id);
const STORAGE="repair_safe_v1";
let state=JSON.parse(localStorage.getItem(STORAGE)||"{}");

if(!state.sites){
 state={sites:[],current:null,filter:"all"};
}

function save(){localStorage.setItem(STORAGE,JSON.stringify(state));}

function parseSpec(s){
 const out=[];
 s.split(",").forEach(p=>{
  let[a,b]=p.split(":");
  if(!b)return;
  if(a.includes("-")){
   let[x,y]=a.split("-").map(Number);
   for(let f=x;f<=y;f++)out.push({f, n:+b});
  }else out.push({f:+a,n:+b});
 });
 return out;
}

function genRooms(spec){
 const r=[];
 parseSpec(spec).forEach(o=>{
  for(let i=1;i<=o.n;i++){
   r.push({id:Math.random(),label:o.f*100+i,status:"todo"});
  }
 });
 return r;
}

function cur(){return state.sites.find(s=>s.id===state.current);}

function render(){
 const sel=$("siteSelect");
 sel.innerHTML="";
 state.sites.forEach(s=>{
  let o=document.createElement("option");
  o.value=s.id;o.textContent=s.name;
  sel.appendChild(o);
 });
 if(state.current)sel.value=state.current;

 const site=cur();
 if(!site)return;

 $("siteMeta").textContent=`部屋数:${site.rooms.length}`;
 $("siteName").value=site.name;
 $("buildingName").value=site.building;
 $("floorSpec").value=site.floorSpec;

 const stats={todo:0,doing:0,done:0};
 site.rooms.forEach(r=>stats[r.status]++);
 $("stats").innerHTML=
  `<div class="pill">未:${stats.todo}</div>
   <div class="pill">途:${stats.doing}</div>
   <div class="pill">完:${stats.done}</div>`;

 const grid=$("roomGrid");grid.innerHTML="";
 let last=null;
 site.rooms
 .filter(r=>state.filter==="all"||r.status===state.filter)
 .forEach(r=>{
  let card=document.createElement("div");
  card.className=`room ${r.status}`;
  card.innerHTML=`<div class=num>${r.label}</div>`;
  card.onclick=()=>{
    r.status=r.status==="todo"?"doing":r.status==="doing"?"done":"todo";
    save();render();
  };
  grid.appendChild(card);
 });
}

$("newSiteBtn").onclick=()=>{
 const s={id:Date.now(),name:"新規現場",building:"",floorSpec:"1:4",rooms:[]};
 s.rooms=genRooms(s.floorSpec);
 state.sites.push(s);state.current=s.id;save();render();
};

$("saveSiteBtn").onclick=()=>{
 const s=cur();
 s.name=$("siteName").value||"無題";
 s.building=$("buildingName").value;
 s.floorSpec=$("floorSpec").value;
 save();render();
};

$("siteSelect").onchange=e=>{
 state.current=+e.target.value;save();render();
};

document.querySelectorAll("[data-filter]").forEach(b=>{
 b.onclick=()=>{state.filter=b.dataset.filter;render();};
});

$("jumpBtn").onclick=()=>{
 const v=$("jumpInput").value;
 const el=[...document.querySelectorAll(".room")]
   .find(e=>e.textContent.trim()==v);
 if(el)el.scrollIntoView({block:"center"});
};

/* 管理画面切替 */
$("manageBtn").onclick=()=>{
 $("mainView").classList.add("hidden");
 $("adminView").classList.remove("hidden");
};
$("backBtn").onclick=()=>{
 $("adminView").classList.add("hidden");
 $("mainView").classList.remove("hidden");
};

/* 危険操作 */
$("resetAllBtn").onclick=()=>{
 if(confirm("全て未着手に戻しますか？")){
  cur().rooms.forEach(r=>r.status="todo");
  save();render();
 }
};

$("deleteSiteBtn").onclick=()=>{
 if(confirm("現場を削除しますか？")){
  state.sites=state.sites.filter(s=>s.id!==state.current);
  state.current=state.sites[0]?.id;
  save();render();
 }
};

/* 二段階タップ */
let armed=false;
$("regenRoomsBtn").onclick=()=>{
 if(!armed){
  armed=true;
  $("regenRoomsBtn").classList.add("armed");
  $("regenRoomsBtn").textContent="もう一度タップすると実行";
  return;
 }
 if(confirm("本当に部屋を再生成しますか？")){
  const s=cur();
  s.rooms=genRooms(s.floorSpec);
  armed=false;
  $("regenRoomsBtn").classList.remove("armed");
  $("regenRoomsBtn").textContent="部屋を再生成";
  save();render();
 }
};

render();
</script>
</body>
</html>
